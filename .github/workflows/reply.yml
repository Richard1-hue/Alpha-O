name: Alpha-O replies

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the AI and reply
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          QUESTION="$ISSUE_TITLE. $ISSUE_BODY"
          PAYLOAD=$(jq -n --arg q "$QUESTION" '{
            systemInstruction: {parts: [{text: "You are Alpha-O, a friendly tech mentor for beginner developers. Explain in simple words, give one short real-life example, keep answers under 120 words, and end with one practice question."}]},
            contents: [{parts: [{text: $q}]}]
          }')
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          STATUS="${RESPONSE##*HTTP_STATUS:}"
          BODY="${RESPONSE%$'\n'HTTP_STATUS:*}"
          echo "Status: $STATUS"
          echo "Body: $BODY"
          ANSWER=$(echo "$BODY" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null || true)
          if [ -z "$ANSWER" ]; then
            ANSWER="Sorry, I could not get an answer right now. Please try again later."
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "$ANSWER"
