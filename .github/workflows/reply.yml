name: Alpha-O replies

on:
  issues:
    types: [opened]

permissions:
  issues: write
  models: read

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the AI and reply
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          QUESTION="$ISSUE_TITLE. $ISSUE_BODY"
          PAYLOAD=$(jq -n --arg q "$QUESTION" '{
            model: "openai/gpt-4.1-mini",
            messages: [
              {role: "system", content: "You are Alpha-O, a friendly helper. Answer clearly and briefly in simple language."},
              {role: "user", content: $q}
            ]
          }')
          RESPONSE=$(curl -sSL -w "\nHTTP_STATUS:%{http_code}" -X POST https://models.github.ai/inference/chat/completions \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          STATUS="${RESPONSE##*HTTP_STATUS:}"
          BODY="${RESPONSE%$'\n'HTTP_STATUS:*}"
          echo "Status: $STATUS"
          echo "Body: $BODY"
          ANSWER=$(echo "$BODY" | jq -r '.choices[0].message.content // empty' 2>/dev/null || true)
          if [ -z "$ANSWER" ]; then
            ANSWER="Sorry, I could not get an answer right now. Please try again later."
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "$ANSWER"
