name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Alpha-O
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            index.html \
            automate/automate.html \
            automate/automate.css \
            automate/automate.js
          do
            if [ ! -f "$file" ]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done

          echo "All required Alpha-O files exist."

      - name: Validate inline JavaScript in index.html
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const { spawnSync } = require("child_process");

          const html = fs.readFileSync("index.html", "utf8");
          const scripts = [
            ...html.matchAll(
              /<script\b(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)<\/script>/gi
            ),
          ];

          if (scripts.length === 0) {
            console.error("No inline JavaScript blocks found.");
            process.exit(1);
          }

          const tempFiles = [];

          try {
            scripts.forEach((match, index) => {
              const file = path.join(
                process.cwd(),
                `.tmp-inline-check-${index}.js`
              );

              tempFiles.push(file);
              fs.writeFileSync(file, match[1], "utf8");

              const result = spawnSync(
                process.execPath,
                ["--check", file],
                { stdio: "inherit" }
              );

              if (result.status !== 0) {
                process.exitCode = 1;
              }
            });
          } finally {
            for (const file of tempFiles) {
              try {
                fs.unlinkSync(file);
              } catch {}
            }
          }

          if (process.exitCode) {
            process.exit(process.exitCode);
          }

          console.log("Inline JavaScript syntax checks passed.");
          NODE

      - name: Validate HTML
        shell: bash
        run: |
          npx --yes htmlhint@0.16.3 index.html automate/automate.html
