<script>
/* time-of-day glow: sets --glow (r,g,b) from the local hour; used by the page and splash backgrounds */
(function(){
  var K = [[0,[72,110,255]],[5,[96,120,255]],[7,[255,178,102]],[12,[16,163,127]],[16.5,[22,176,150]],[18.5,[255,140,96]],[20.5,[150,112,255]],[24,[72,110,255]]];
  function glow(){
    var d = new Date(), h = d.getHours() + d.getMinutes() / 60, i = 0;
    while (i < K.length - 2 && h >= K[i + 1][0]) i++;
    var a = K[i], b = K[i + 1], t = (h - a[0]) / (b[0] - a[0]);
    var c = [0, 1, 2].map(function(n){ return Math.round(a[1][n] + (b[1][n] - a[1][n]) * t); });
    document.documentElement.style.setProperty("--glow", c.join(","));
  }
  glow(); setInterval(glow, 60000);
})();
</script>
<style>
:root{--bg:#262624;--side:#1f1e1d;--panel:#30302e;--line:#434340;--text:#ece9e2;--muted:#a3a098;--accent:#10a37f;--eye:#ffc86b}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;display:flex}
.bar{display:flex;gap:8px;align-items:center}
button{position:relative;overflow:hidden;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:15px;cursor:pointer;font-family:inherit;transition:transform .25s,box-shadow .25s,border-color .25s}
button::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.16) 50%,transparent 70%);transform:translateX(-130%)}
button:hover{transform:translateY(-1px);border-color:#5c5c5c;box-shadow:0 6px 18px rgba(16,163,127,.22)}
button:hover::after{transform:translateX(130%);transition:transform .7s}
button:focus-visible,#q:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ib{padding:7px;border-radius:8px;background:none;border-color:transparent;color:var(--muted);display:inline-grid;place-items:center}
.ib:hover{color:var(--text);background:rgba(255,255,255,.08)}
[data-ic] svg,.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
#tip{position:fixed;display:none;z-index:20;background:#0d0d0d;color:#fff;font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid #333;pointer-events:none;white-space:nowrap}
*{scrollbar-width:thin;scrollbar-color:#444 transparent}
::selection{background:rgba(16,163,127,.35)}
.ver{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(16,163,127,.16);color:#6ee7c0;border:1px solid rgba(16,163,127,.35);font-weight:600;letter-spacing:.02em}
.pri{background:var(--text);color:#171717;border-color:var(--text)}
/* --- theme, settings, extras --- */
[data-theme="light"]{--bg:#fff;--side:#f4f4f6;--panel:#f0f0f3;--line:#d9d9df;--text:#1b1b1f;--muted:#6a6a74;--accent:#0d8a6a}
.ov2{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:9;padding:16px}
.mod{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:16px;width:min(460px,100%);max-height:88vh;overflow:auto;padding:16px 20px 20px}
.mh{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.mod h4{margin:16px 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.mod .note{margin:0;font-size:13.5px;line-height:1.55;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#toast.on{opacity:1}
/* ===== Stage 2: command-center layout ===== */
body{height:100vh;height:100dvh}
.ib::after,.mchip::after,.vopt::after{display:none}
.mod{max-height:88vh;max-height:88dvh;overscroll-behavior:contain}
@media(pointer:coarse){
  .ib{min-width:40px;min-height:40px}
}
@keyframes vp{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.6}}
/* ===== Revision 4: new features ===== */
#toast{z-index:10070}
.cab{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;font-size:12px;min-height:0;border-radius:8px}
.cab svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:500px){
  .cab span{display:none}
}
kbd{font:600 11px/1 Consolas,ui-monospace,monospace;background:rgba(255,255,255,.08);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:3px 6px;color:var(--muted);display:inline-block;min-width:22px;text-align:center}
[data-theme="light"] kbd{background:#fff}
#tip kbd{background:rgba(255,255,255,.14);border-color:#555;color:#eee;padding:2px 5px}
.ov2:not([hidden]){animation:ao-in .16s ease-out both}
.ov2:not([hidden]) .mod{animation:ao-pop .2s ease-out both}
@keyframes ao-in{from{opacity:0}to{opacity:1}}
@keyframes ao-pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
</style>

// A random ID for this browser, used only to group analytics events.
// It is not a name, email address, or account identifier.
function getVisitorId(){
  try {
    let id = localStorage.getItem("alphaO_visitor_id");
    if (!id || !/^[a-zA-Z0-9-]{8,64}$/.test(id)) {
      const bytes = new Uint8Array(16);
      if (window.crypto && window.crypto.getRandomValues) {
        window.crypto.getRandomValues(bytes);
      } else {
        for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
      }
      id = "ao-" + Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
      localStorage.setItem("alphaO_visitor_id", id);
    }
    return id;
  } catch (e) {
    // Continue to let the chat work if browser storage is unavailable.
    return "ao-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
  }
}
const VISITOR_ID = getVisitorId();

// Record this page visit in the background. Analytics failure must not affect chat.
function recordVisit(){
  if (!API_URL) return;
  fetch(API_URL + "visit", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ visitor_id: VISITOR_ID }),
    keepalive: true
  }).catch(() => {});
}

    }, {passive: true});

})();

<script>
/* ===== Alpha-O fragment loader =====
   Fetches components/*.html, mounts their markup into the <template data-ao-slot> markers above,
   adds their <style> blocks, then runs their <script> blocks as fresh classic scripts
   (scripts inside innerHTML/template content never run on their own).
   Stages, in the same order the original single file used:
     A  markup into slots + early styles
     B  ONE classic script = ao-core-head + every data-ao-scope="app" script + ao-core-boot
        (the app core shares one global scope: top-level let/const, hoisted functions, and the
         add-on layers that wrap send/speak/listen/readAloud. Joining keeps that scope identical.)
     C  standalone add-on layers (data-ao-scope="late"), one script each, in original order
   If anything fails, a visible error banner is shown. */
(function () {
  "use strict";
  var DIR = "components/";
  var PARTS = ["startup", "sidebar", "chat", "settings", "dialogs", "app-updates", "voice-mode", "robot-3d", "read-aloud",
               "automate", "chat-extras", "voice-extras", "voice-plus"];            /* fetch list + early style (cascade) order */
  var APP_ORDER = ["chat", "voice-mode", "robot-3d", "sidebar", "settings", "read-aloud", "dialogs", "app-updates"];
  var LATE_ORDER = ["automate", "startup", "chat-extras", "voice-extras", "voice-plus"];
  var started = false;

  function banner(msg) {
    var d = document.getElementById("ao-load-error");
    if (!d) {
      d = document.createElement("div"); d.id = "ao-load-error"; d.setAttribute("role", "alert");
      d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:2147483647;padding:14px 16px;background:#7a1f1f;color:#fff;font:14px/1.4 system-ui,sans-serif;white-space:pre-wrap";
      document.body.appendChild(d);
    }
    d.textContent += (d.textContent ? "\n" : "") + msg;
  }
  function fetchPart(name) {
    return fetch(DIR + name + ".html").then(function (r) {
      if (!r.ok) throw new Error("components/" + name + ".html: HTTP " + r.status);
      return r.text();
    });
  }
  function parse(text) {
    var t = document.createElement("template"); t.innerHTML = text;
    var f = { slots: {}, styles: [], scripts: [] };
    Array.prototype.forEach.call(t.content.children, function (el) {
      if (el.tagName === "TEMPLATE" && el.hasAttribute("data-ao-slot")) f.slots[el.getAttribute("data-ao-slot")] = el.content;
      else if (el.tagName === "STYLE") f.styles.push(el);
      else if (el.tagName === "SCRIPT") f.scripts.push(el);
    });
    return f;
  }
  function clone(tag, src, text) {
    var n = document.createElement(tag);
    Array.prototype.forEach.call(src ? src.attributes : [], function (a) { if (a.name.indexOf("data-ao-") !== 0) n.setAttribute(a.name, a.value); });
    n.textContent = text; return n;
  }
  function runScript(src, text, errors, label) {
    var onErr = function (e) { errors.push(label + ": " + (e.message || e.error)); };
    window.addEventListener("error", onErr);
    try { document.body.appendChild(clone("script", src, text)); } catch (e) { errors.push(label + ": " + e.message); }
    window.removeEventListener("error", onErr);
  }
  function run(texts) {
    if (started) return; started = true;
    var frags = {}, errors = [];
    PARTS.forEach(function (n, i) { frags[n] = parse(texts[i]); });
    /* A: markup */
    Array.prototype.slice.call(document.querySelectorAll("template[data-ao-slot]")).forEach(function (ph) {
      var name = ph.getAttribute("data-ao-slot"), content = null;
      PARTS.forEach(function (n) { if (frags[n].slots[name]) { content = frags[n].slots[name]; delete frags[n].slots[name]; } });
      if (!content) throw new Error("No component provides markup for slot \"" + name + "\"");
      ph.replaceWith(content);
    });
    /* A: early styles (late ones are added right before their own script) */
    PARTS.forEach(function (n) {
      frags[n].styles.forEach(function (s) { if (s.getAttribute("data-ao-stage") !== "late") document.head.appendChild(clone("style", s, s.textContent)); });
    });
    /* B: shared-scope app script */
    var wasLoaded = document.readyState === "complete";
    var parts = [document.getElementById("ao-core-head").textContent];
    APP_ORDER.forEach(function (n) {
      frags[n].scripts.forEach(function (s) { if (s.getAttribute("data-ao-scope") === "app") parts.push(s.textContent); });
    });
    parts.push(document.getElementById("ao-core-boot").textContent);
    runScript(null, parts.join("\n\n"), errors, "app core");
    /* C: standalone layers */
    LATE_ORDER.forEach(function (n) {
      var f = frags[n];
      f.styles.forEach(function (s) { if (s.getAttribute("data-ao-stage") === "late") document.head.appendChild(clone("style", s, s.textContent)); });
      if (f.slots["body-end"]) document.body.appendChild(f.slots["body-end"]);
      f.scripts.forEach(function (s) { if (s.getAttribute("data-ao-scope") === "late") runScript(s, s.textContent, errors, n); });
    });
    /* fetch() does not hold back window "load"; if it already fired, replay it once for the listeners just added */
    if (wasLoaded) window.dispatchEvent(new Event("load"));
    if (errors.length) banner("Alpha-O: a component raised an error while starting:\n" + errors.join("\n"));
  }
  Promise.all(PARTS.map(fetchPart)).then(run).catch(function (e) {
    banner("Alpha-O could not load its components (" + e.message + ").\nIt must be served over http(s) (opening index.html from file:// is not supported). Reload to retry.");
  });
})();
