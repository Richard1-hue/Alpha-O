function md(src){
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const inl = s => esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\n]+)\*/g,"$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s"]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');

  const fp = () => { if (para.length){ out += "<p>" + para.join("<br>") + "</p>"; para = []; } };
  const fl = () => { if (list){ out += "</" + list + ">"; list = ""; } };
  for (const ln of src.split("\n")){
    if (/^\s*```/.test(ln)){
      if (code === null){ fp(); fl(); code = []; } else { out += "<pre><code>" + esc(code.join("\n")) + "</code></pre>"; code = null; }
      continue;
    }
    if (code !== null){ code.push(ln); continue; }
    let m;
    if (m = ln.match(/^\s*[-*]\s+(.*)/)){ fp(); if (list !== "ul"){ fl(); out += "<ul>"; list = "ul"; } out += "<li>" + inl(m[1]) + "</li>"; }
    else if (m = ln.match(/^\s*\d+[.)]\s+(.*)/)){ fp(); if (list !== "ol"){ fl(); out += "<ol>"; list = "ol"; } out += "<li>" + inl(m[1]) + "</li>"; }
    else if (m = ln.match(/^#{1,4}\s+(.*)/)){ fp(); fl(); out += "<h4>" + inl(m[1]) + "</h4>"; }
    else if (!ln.trim()){ fp(); fl(); }
    else { fl(); para.push(inl(ln)); }
  }
  if (code !== null) out += "<pre><code>" + esc(code.join("\n")) + "</code></pre>";
  fp(); fl(); return out;
}
function add(text, who){
  const r = document.createElement("div"); r.className = "row " + who;
  const m = document.createElement("div"); m.className = "msg " + who;
  if (who === "bot"){ const a = document.createElement("div"); a.className = "av"; a.innerHTML = LOGO_USE; r.appendChild(a); }
  if (text){ if (who === "bot") m.innerHTML = md(text); else m.textContent = text; }

function typeInto(el, text){
  el.innerHTML = md(text);
  if (reduce) return;
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = []; let n;
  while (n = w.nextNode()) nodes.push([n, n.nodeValue]);

      const s = nodes[k][1], take = Math.min(c, s.length - i);
      i += take; c -= take; nodes[k][0].nodeValue = s.slice(0, i);
      if (i >= s.length){ k++; i = 0; }

    $("chat").scrollTop = $("chat").scrollHeight;
    if (k >= nodes.length) clearInterval(t);
  }, 18);
}
async function ask(){
  if (!API_URL){
    const f = file ? " I also received your file *" + file.name + "*." : "";

function speak(text){

  const clean = text.replace(/```[\s\S]*?```/g, " code block. ").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/[*#`_>~]/g, "").replace(/\s+/g, " ").trim();
  const parts = clean.match(/[^.!?]+[.!?]*\s*/g) || [clean], chunks = []; let cur = "";
  parts.forEach(p => { if (cur && (cur + p).length > 200){ chunks.push(cur); cur = p; } else cur += p; });
  if (cur) chunks.push(cur);

  setTimeout(() => {
    if (tok !== spk) return;
    const v = speechSynthesis.getVoices().find(x => /^en/i.test(x.lang));
    chunks.forEach((c, i) => {
      const u = new SpeechSynthesisUtterance(c); u.lang = "en-US"; if (v) u.voice = v;
      u.onstart = () => { if (tok === spk){ $("face").setAttribute("class", "speaking " + emo); $("status").textContent = "Speaking..."; } };
      if (i === chunks.length - 1) u.onend = u.onerror = () => { if (tok !== spk) return; setFace(emo, "Tap the mic to reply"); if (voiceOn) setTimeout(listen, 500); };
      speechSynthesis.speak(u);

function unlockSound(){ if (window.speechSynthesis){ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } }
$("voiceBtn").onclick = () => { voiceOn = true; unlockSound(); $("voice").classList.add("on"); setFace("", "Tap the mic and speak"); mouthFor(""); };

(function(){

let chats = [], curId = null;
try { chats = JSON.parse(localStorage.getItem("alphaO_chats") || "[]"); } catch(e){ chats = []; }
function persist(){ try { localStorage.setItem("alphaO_chats", JSON.stringify(chats)); } catch(e){} }
function closeSide(){ if (innerWidth < 800) document.body.classList.add("fold"); }
function saveChat(){
  if (!history.length) return;
  let c = chats.find(x => x.id === curId);
  if (!c){ c = {id: curId, title: history[0].text.slice(0, 40), ts: Date.now(), pin: false, msgs: []}; chats.unshift(c); }
  c.msgs = history; c.ts = Date.now(); persist(); renderSide();
}
function renderSide(){
  const q = $("q").value.toLowerCase(), box = $("list"); box.innerHTML = "";
  const day = 864e5, t0 = new Date().setHours(0,0,0,0);
  const groups = [["Pinned", c => c.pin], ["Today", c => !c.pin && c.ts >= t0], ["Yesterday", c => !c.pin && c.ts < t0 && c.ts >= t0 - day], ["Previous 7 days", c => !c.pin && c.ts < t0 - day && c.ts >= t0 - 7 * day], ["Older", c => !c.pin && c.ts < t0 - 7 * day]];
  groups.forEach(g => {
    const items = chats.filter(c => g[1](c) && (!q || c.title.toLowerCase().includes(q) || c.msgs.some(m => m.text.toLowerCase().includes(q)))).sort((a, b) => b.ts - a.ts);
    if (!items.length) return;
    const h = document.createElement("div"); h.className = "gh"; h.textContent = g[0]; box.appendChild(h);
    items.forEach(c => {
      const r = document.createElement("div"); r.className = "ci" + (c.id === curId ? " on" : "");
      const t = document.createElement("span"); t.className = "ct"; t.textContent = c.title; t.onclick = () => loadChat(c.id);
      const p = document.createElement("button"); p.className = "ib"; p.title = c.pin ? "Unpin" : "Pin"; p.innerHTML = ic("pin"); p.onclick = () => { c.pin = !c.pin; persist(); renderSide(); };
      const d = document.createElement("button"); d.className = "ib"; d.title = "Delete"; d.innerHTML = ic("trash");
      d.onclick = () => { if (confirm("Delete this chat?")){ chats = chats.filter(x => x.id !== c.id); persist(); if (c.id === curId) newChat(); else renderSide(); } };
      r.append(t, p, d); box.appendChild(r);
    });
  });
  if (!box.children.length) box.innerHTML = '<div class="gh">No chats yet</div>';
}
function loadChat(id){
  const c = chats.find(x => x.id === id); if (!c) return;
  curId = id; history = c.msgs; file = null; $("chip").style.display = "none"; $("chat").innerHTML = "";
  history.forEach(m => m.role === "user" ? add(m.text + (m.file ? "  [" + m.file + "]" : ""), "you") : add(m.text, "bot"));

}
