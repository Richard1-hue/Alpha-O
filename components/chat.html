function flowHtml(src){
  const nodes = [], idx = {}, edges = [];
  const node = n => { n = n.replace(/^[-*\d.)\s]+/, "").replace(/[`*]/g, "").trim().slice(0, 60); if (!n) return -1; if (!(n in idx)){ idx[n] = nodes.length; nodes.push(n); } return idx[n]; };

  const lvl = nodes.map(() => -1), q = [];
  nodes.forEach((n, i) => { if (!indeg[i]){ lvl[i] = 0; q.push(i); } });
  if (!q.length){ lvl[0] = 0; q.push(0); }
  while (q.length){ const u = q.shift(); edges.forEach(e => { if (e[0] === u && lvl[e[1]] < 0){ lvl[e[1]] = lvl[u] + 1; q.push(e[1]); } }); }

}
