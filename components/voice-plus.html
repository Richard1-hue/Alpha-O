<!--
  component: Voice-Plus (additive): voice commands, auto language, hands-free, typing box, floating robot head while reading an answer

<style data-ao-stage="late" id="ao-vp-css">
/* ---------- 6. clearer toolbar icons ---------- */

.aoLbl{font-size:12.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
#aoHFBtn.on{color:#6ee7c0;background:rgba(16,163,127,.2)}
@media(max-width:560px){.aoLbl{display:none}#aoTrBtn,#aoHFBtn,#aoSetBtn{padding:7px}}

#aoVIn::placeholder{color:var(--muted)}
#aoVSend{background:var(--accent);color:#fff;border-radius:50%;width:34px;height:34px;padding:0}
#aoVSend:hover{color:#fff;background:var(--accent)}
#voice.ao-hasin{--ao-in-h:60px}
#voice.ao-hasin #aoCap{bottom:calc(max(12px,env(safe-area-inset-bottom)) + var(--ao-in-h))}

  #voice.on.ao-hasin{padding-bottom:calc(var(--ao-cap-h,96px) + 58px + var(--ao-in-h))}
  #voice.on.rv2.ao-hasin #face{width:min(780px,96vw,calc(100dvh - 350px - var(--ao-in-h)))}
}

@keyframes aoFgl{0%,100%{opacity:.55}50%{opacity:1}}

function floatFrame(){

  R.talk.scale.y = .3 + .7 * Math.abs(Math.sin(t * 13));

function floatShow(){

}
function floatHide(){
