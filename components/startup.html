<style id="ao-splash-css">
/* ===== Alpha-O splash (logo + motto) : standalone, touches nothing else ===== */
#aoSplash{position:fixed;inset:0;z-index:100000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--bg,#262624);color:var(--text,#ece9e2);font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden;opacity:1;transition:opacity .7s ease,visibility .7s;cursor:pointer;-webkit-tap-highlight-color:transparent}
#aoSplash::before{content:"";position:absolute;top:-140px;right:-100px;width:560px;height:440px;background:radial-gradient(closest-side,rgba(var(--glow,16,163,127),.17),transparent);pointer-events:none}
#aoSplash::after{content:"";position:absolute;left:50%;top:44%;width:min(80vw,640px);height:min(80vw,640px);transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(var(--glow,16,163,127),.18),transparent 70%);pointer-events:none;animation:aoSpGlow 3.2s ease-in-out infinite}
#aoSplash.out{opacity:0;visibility:hidden;pointer-events:none}
#aoSpStage{position:relative;width:min(56vmin,280px);height:min(56vmin,280px);animation:aoSpIn .9s cubic-bezier(.2,.8,.2,1) both}
#aoSpStage canvas{width:100%!important;height:100%!important;display:block}
#aoSpFall{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none;filter:drop-shadow(0 0 24px rgba(16,163,127,.45));animation:aoSpFloat 3s ease-in-out infinite}
#aoSpName{position:relative;margin-top:6px;font-size:clamp(26px,5vw,38px);font-weight:600;letter-spacing:.02em;animation:aoSpUp .8s .5s cubic-bezier(.2,.8,.2,1) both}
#aoSpMotto{position:relative;margin:0;color:var(--muted,#a3a098);font-size:clamp(14px,2.6vw,18px);letter-spacing:.14em;text-transform:lowercase;animation:aoSpUp .8s .85s cubic-bezier(.2,.8,.2,1) both}
#aoSpBar{position:relative;margin-top:22px;width:120px;height:3px;border-radius:3px;background:var(--line,#434340);overflow:hidden;animation:aoSpUp .6s 1s both}
#aoSpBar i{display:block;height:100%;width:100%;border-radius:3px;background:var(--accent,#10a37f);transform:scaleX(0);transform-origin:left;animation:aoSpBar var(--aoSpDur,2.8s) linear forwards}
@keyframes aoSpIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes aoSpUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes aoSpBar{to{transform:scaleX(1)}}
@keyframes aoSpGlow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes aoSpFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* hand-off: background, glows, motto and bar fade while the robot flies to the welcome logo */
@keyframes aoSpFade{to{opacity:0}}
#aoSplash.hand{background:transparent;transition:background .8s ease;pointer-events:none}
#aoSplash.hand::before,#aoSplash.hand::after{animation:aoSpFade .7s ease forwards}
#aoSplash.hand #aoSpName,#aoSplash.hand #aoSpMotto,#aoSplash.hand #aoSpStatus,#aoSplash.hand #aoSpBar{animation:aoSpFade .5s ease forwards}
/* boot status line under the motto */
#aoSpStatus{position:relative;margin:16px 0 0;min-height:1.5em;font-size:clamp(12px,2.3vw,14px);color:var(--muted,#a3a098);letter-spacing:.1em;animation:aoSpUp .8s 1.05s both}
#aoSpStatus span{display:inline-block;transition:opacity .16s ease,transform .16s ease}
#aoSpStatus span.sw{opacity:0;transform:translateY(4px)}
@media(prefers-reduced-motion:reduce){#aoSplash::after,#aoSpFall{animation:none}}
</style>
<script data-ao-scope="late">
(function(){
  var sp = document.getElementById("aoSplash"); if (!sp) return;
  var MIN = 10000, t0 = performance.now(), done = false, raf = 0, R = null, HD = 800, HK = null;   /* splash duration in ms (10 s) */
  sp.style.setProperty("--aoSpDur", MIN + "ms");

  /* boot status: the line under the motto changes as the progress bar fills */
  var ST = [[0, "Waking up"], [.2, "Loading skills"], [.42, "Connecting to the network"], [.64, "Tuning responses"], [.86, "Ready"]];
  var stEl = sp.querySelector("#aoSpStatus span"), stI = 0, stT = 0;
  function stTick(){
    if (done || !stEl){ clearInterval(stT); return; }
    var p = (performance.now() - t0) / MIN, n = 0, i;
    for (i = 0; i < ST.length; i++) if (p >= ST[i][0]) n = i;
    if (n === stI) return; stI = n;
    stEl.classList.add("sw");
    setTimeout(function(){ if (stEl){ stEl.textContent = ST[n][1]; stEl.classList.remove("sw"); } }, 170);
  }
  stT = setInterval(stTick, 150);

  /* hand-off: the splash robot shrinks and slides into the welcome logo, then the splash is removed */
  function handoff(){
    try {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return false;
      var stage = document.getElementById("aoSpStage"), logo = document.querySelector("#welcome .lg.big");
      if (!stage || !logo || !stage.animate || !logo.animate) return false;
      var s = stage.getBoundingClientRect(), l = logo.getBoundingClientRect();
      if (!s.width || !l.width || l.bottom < 0 || l.top > innerHeight) return false;
      var fb = document.getElementById("aoSpFall"), fill = (fb && fb.style.display === "block") ? 1 : .66;   /* the 3D head fills about 66% of its stage; the static fallback logo fills all of it */
      var D = 1100, k = (l.width / fill) / s.width;
      var dx = (l.left + l.width / 2) - (s.left + s.width / 2), dy = (l.top + l.height / 2) - (s.top + s.height / 2);
      var end = "translate(" + dx + "px," + dy + "px) scale(" + k + ")";
      var a1 = stage.animate([{transform: "translate(0px,0px) scale(1)", opacity: 1}, {transform: end, opacity: 1, offset: .78}, {transform: end, opacity: 0}], {duration: D, easing: "cubic-bezier(.6,0,.2,1)", fill: "forwards"});
      var a2 = logo.animate([{opacity: 0}, {opacity: 0, offset: .7}, {opacity: 1}], {duration: D, fill: "both"});
      sp.classList.add("hand"); HD = D + 80;
      HK = function(){ try { a1.cancel(); a2.cancel(); } catch(e){} };
      return true;
    } catch(e){ return false; }
  }

  function finish(){
    if (done) return; done = true;
    if (!handoff()) sp.classList.add("out");
    setTimeout(function(){
      cancelAnimationFrame(raf);
      try { if (R){ R.scene.traverse(function(o){ if (o.geometry) o.geometry.dispose(); if (o.material){ (Array.isArray(o.material) ? o.material : [o.material]).forEach(function(m){ if (m.map) m.map.dispose(); m.dispose(); }); } }); R.renderer.dispose(); if (R.renderer.forceContextLoss) R.renderer.forceContextLoss(); } } catch(e){}
      if (sp.parentNode) sp.parentNode.removeChild(sp);
      var c = document.getElementById("ao-splash-css"); if (c && c.parentNode) c.parentNode.removeChild(c);
      if (HK) HK();
      try { if (window.aoSplashFinished) window.aoSplashFinished(); } catch(e){}
    }, HD);
  }
  function ready(){ var left = Math.max(0, MIN - (performance.now() - t0)); setTimeout(finish, left); }
  if (document.readyState === "complete") ready(); else addEventListener("load", ready);
  setTimeout(finish, MIN + 6000);                       /* safety net */
  sp.addEventListener("click", function(){ if (performance.now() - t0 > 1000) finish(); });   /* tap to skip */

  function fallback(){ var f = document.getElementById("aoSpFall"); if (f) f.style.display = "block"; }

  try {
    if (!window.THREE) throw new Error("three.js missing");
    var stage = document.getElementById("aoSpStage");
    var renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);
    stage.insertBefore(renderer.domElement, stage.firstChild);
    var scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(32, 1, .1, 50);
    cam.position.set(0, 0, 6.9);
    function size(){ var w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight); renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
    size(); addEventListener("resize", size);

    /* ---------- proportions measured from logo.png (1 unit = 260 logo px at 4x) ---------- */
    var HX = 1.25, HY = 1.07, HZ = .9;                        /* head ellipsoid radii */
    var VX = 1.15, VY = .77, VCY = .03;                       /* black visor (big oval) */
    function zAt(x, y){ var q = 1 - (x / HX) * (x / HX) - (y / HY) * (y / HY); return HZ * Math.sqrt(Math.max(0, q)); }   /* head surface depth */

    /* flat elliptical patch that hugs the head surface (used for visor + eyes) */
    function patch(rx, ry, cx, cy, lift, rings, segs){
      var pos = [], idx = [], i, r, s, a, x, y;
      pos.push(0, 0, zAt(cx, cy) + lift);
      for (r = 1; r <= rings; r++) for (s = 0; s < segs; s++){
        a = s / segs * Math.PI * 2; x = rx * (r / rings) * Math.cos(a); y = ry * (r / rings) * Math.sin(a);
        pos.push(x, y, zAt(cx + x, cy + y) + lift);
      }
      for (s = 0; s < segs; s++) idx.push(0, 1 + s, 1 + (s + 1) % segs);
      for (r = 2; r <= rings; r++) for (s = 0; s < segs; s++){
        var a0 = 1 + (r - 2) * segs + s, a1 = 1 + (r - 2) * segs + (s + 1) % segs, b0 = 1 + (r - 1) * segs + s, b1 = 1 + (r - 1) * segs + (s + 1) % segs;
        idx.push(a0, b0, b1, a0, b1, a1);
      }
      var g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals(); return g;
    }
    function rrect(w, h, r){
      var s = new THREE.Shape(), x = -w / 2, y = -h / 2;
      s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.absarc(x + w - r, y + r, r, -Math.PI / 2, 0);
      s.lineTo(x + w, y + h - r); s.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2);
      s.lineTo(x + r, y + h); s.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
      s.lineTo(x, y + r); s.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5); return s;
    }

    /* materials */
    var shellM = new THREE.MeshPhysicalMaterial({vertexColors: true, roughness: .22, metalness: .08, clearcoat: 1, clearcoatRoughness: .18, emissive: 0x2a6fa8, emissiveIntensity: .16});
    var visorM = new THREE.MeshPhysicalMaterial({color: 0x050813, roughness: .14, metalness: .35, clearcoat: 1, clearcoatRoughness: .1, side: THREE.DoubleSide});
    var whiteM = new THREE.MeshBasicMaterial({color: 0xffffff, side: THREE.DoubleSide});
    var earM   = new THREE.MeshStandardMaterial({color: 0xffffff, emissive: 0xdfeaf5, emissiveIntensity: .35, roughness: .4, metalness: 0});
    var noseM  = new THREE.MeshPhysicalMaterial({color: 0x9cc6ee, emissive: 0x4f86bd, emissiveIntensity: .35, roughness: .2, metalness: .2, clearcoat: 1});
    var rodM   = new THREE.MeshStandardMaterial({color: 0x6f8fd8, roughness: .35, metalness: .3, emissive: 0x2c4d9a, emissiveIntensity: .3});
    var bulbM  = new THREE.MeshStandardMaterial({color: 0xffffff, emissive: 0xcfeaff, emissiveIntensity: 1, roughness: .2, metalness: 0});

    var rob = new THREE.Group(), hd = new THREE.Group(); rob.add(hd); scene.add(rob); rob.position.y = -.2;

    /* head: egg-shaped shell with light-blue top → deeper blue bottom */
    var hg = new THREE.SphereGeometry(1, 64, 48), pa = hg.attributes.position, col = [], cT = new THREE.Color(0xcdeaff), cM = new THREE.Color(0x9ccbf0), cB = new THREE.Color(0x5f9ad0), cc = new THREE.Color();
    for (var i = 0; i < pa.count; i++){ var yy = pa.getY(i); if (yy >= 0) cc.copy(cM).lerp(cT, yy); else cc.copy(cM).lerp(cB, -yy); col.push(cc.r, cc.g, cc.b); }
    hg.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    var head = new THREE.Mesh(hg, shellM); head.scale.set(HX, HY, HZ); hd.add(head);

    /* visor */
    var visor = new THREE.Mesh(patch(VX, VY, 0, VCY, .014, 26, 96), visorM); visor.position.set(0, VCY, 0); hd.add(visor);

    /* eyes: plain white ovals exactly where the logo has them */
    var eyes = [];
    [[-.51, .277], [.52, .277]].forEach(function(p){
      var e = new THREE.Mesh(patch(.235, .31, p[0], p[1], .034, 10, 48), whiteM); e.position.set(p[0], p[1], 0); hd.add(e); eyes.push(e);
    });

    /* nose: small glossy blue-silver oval */
    var nose = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 20), noseM); nose.scale.set(.062, .09, .05);
    nose.position.set(.027, -.023, zAt(.027, -.023) + .03); hd.add(nose);

    /* mouth: white bar like the logo, easing into a gentle smile */
    var mouth = null, MX = .027, MY = -.385, MHALF = .22, MR = .03;
    function buildMouth(k){
      if (mouth){ hd.remove(mouth); mouth.geometry.dispose(); }
      var pts = [], n = 18, u, x, y;
      for (var j = 0; j <= n; j++){ u = j / n * 2 - 1; x = MX + u * MHALF; y = MY - k * .04 + k * .097 * u * u; pts.push(new THREE.Vector3(x, y, zAt(x, y) + .034)); }
      mouth = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 28, MR, 10, false), whiteM); hd.add(mouth);
    }
    var smileK = 0; buildMouth(0);

    /* ears: white rounded tabs, same size/position as the logo */
    [-1, 1].forEach(function(s){
      var eg = new THREE.ExtrudeGeometry(rrect(.16, .37, .06), {depth: .16, bevelEnabled: true, bevelThickness: .035, bevelSize: .03, bevelSegments: 4, curveSegments: 10});
      eg.translate(0, 0, -.08);
      var ear = new THREE.Mesh(eg, earM); ear.position.set(s * 1.335, -.01, 0); hd.add(ear);
    });

    /* antenna (its own group: only this vibrates) */
    var ANT_Y = 1.062;
    var ant = new THREE.Group(); ant.position.set(0, ANT_Y, 0); hd.add(ant);
    var rod = new THREE.Mesh(new THREE.CylinderGeometry(.013, .013, .27, 10), rodM); rod.position.y = .125; ant.add(rod);
    var bulb = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), bulbM); bulb.scale.setScalar(.092); bulb.position.y = .325; ant.add(bulb);
    var glowTex = (function(){
      var c = document.createElement("canvas"); c.width = c.height = 128; var x = c.getContext("2d");
      var g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
      g.addColorStop(0, "rgba(227,244,255,.95)"); g.addColorStop(.5, "rgba(143,208,255,.45)"); g.addColorStop(1, "rgba(143,208,255,0)");
      x.fillStyle = g; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
    })();
    var halo = new THREE.Sprite(new THREE.SpriteMaterial({map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false}));
    halo.position.set(0, .325, .05); halo.scale.set(.6, .6, 1); ant.add(halo);
    var bulbLight = new THREE.PointLight(0xbfe4ff, 1, 5); bulbLight.position.set(0, .45, .5); ant.add(bulbLight);

    /* lights */
    scene.add(new THREE.AmbientLight(0xbcd4ff, .8));
    var key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(-3, 5, 6); scene.add(key);
    var rim = new THREE.DirectionalLight(0x4aa8ff, 1.5); rim.position.set(4, 1, -4); scene.add(rim);
    var fill = new THREE.PointLight(0x10a37f, .6, 18); fill.position.set(-3, -2, 4); scene.add(fill);

    var px = 0, py = 0, gx = 0, gy = 0;
    sp.addEventListener("pointermove", function(e){ px = (e.clientX / innerWidth - .5) * .25; py = (e.clientY / innerHeight - .5) * .15; });

    var clock = new THREE.Clock(), nextBlink = 1.2, blink = 0, vibEnd = 0, nextVib = 1.0, vibAmp = 0;
    var L = function(a, b, k){ return a + (b - a) * k; }, TAU = Math.PI * 2;
    function frame(){
      raf = requestAnimationFrame(frame);
      var t = clock.getElapsedTime();
      /* blink: quick squash like the welcome-page head, sometimes twice */
      if (t > nextBlink){ blink = 1; nextBlink = t + (Math.random() < .25 ? .3 : 1.8 + Math.random() * 1.4); }
      blink = Math.max(0, blink - .09);
      var lid = 1 - .92 * Math.sin(blink * Math.PI);
      eyes.forEach(function(e){ e.scale.y = lid; });
      /* mouth: logo's flat bar first, then eases into a gentle smile */
      var sk = Math.min(1, Math.max(0, (t - 2.4) / 1.2)); sk = sk * sk * (3 - 2 * sk);
      if (Math.abs(sk - smileK) > .008){ smileK = sk; buildMouth(smileK); }
      /* bulb light pulse (pale blue-white glow, as on the welcome page) */
      var pulse = .5 + .5 * Math.sin(t * 3);
      /* ANTENNA-ONLY vibration: short bursts */
      if (t > nextVib){ vibEnd = t + .5; nextVib = t + 1.3 + Math.random() * 1.0; }
      vibAmp = L(vibAmp, t < vibEnd ? 1 : 0, .3);
      ant.rotation.z = Math.sin(t * 70) * .2 * vibAmp;
      ant.rotation.x = Math.cos(t * 61) * .1 * vibAmp;
      bulb.scale.setScalar(.092 * (1 + .12 * vibAmp * Math.abs(Math.sin(t * 55))));
      bulbM.emissiveIntensity = .9 + pulse * .9 + vibAmp * .6;
      halo.material.opacity = .6 + pulse * .4; var hs = .55 + pulse * .25 + vibAmp * .12; halo.scale.set(hs, hs, 1);
      bulbLight.intensity = .8 + pulse * 1.2 + vibAmp * .8;
      /* head: same slow turn as the welcome-page logo (about ±18°), gentle float */
      gx = L(gx, px, .06); gy = L(gy, py, .06);
      rob.position.y = -.2 + Math.sin(t * 1.5) * .03;
      hd.rotation.y = -Math.sin(t * TAU / 8) * .31 + gx;
      hd.rotation.x = gy;
      hd.rotation.z = 0;
      renderer.render(scene, cam);
    }
    R = {renderer: renderer, scene: scene};
    frame();
  } catch(e){
    fallback();   /* no WebGL / three.js: show the static logo instead */
  }
})();
</script>
