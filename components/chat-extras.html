<!--
  component: AO2 chat polish layer (additive)
  Glow ring, caret, date separators, code-block upgrades, ripple/haptics, skip links, slash commands. Standalone IIFE; reads app globals only via typeof guards.
  Fragment (not a standalone document). Loaded by index.html.
-->
<style data-ao-stage="late" id="ao2-style">
@property --ao2-a{syntax:"<angle>";inherits:false;initial-value:0deg}
@property --ao2-r{syntax:"<length>";inherits:false;initial-value:0px}

/* ---------- 1. conic glow ring on the composer while a reply is generating ---------- */
#box.ao2-gen{position:relative;border-color:transparent;animation:ao2-breathe 2.6s ease-in-out infinite}
#box.ao2-gen::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:2px;pointer-events:none;
  background:conic-gradient(from var(--ao2-a),rgba(var(--glow,16,163,127),0) 0deg,rgba(var(--glow,16,163,127),.95) 100deg,#8fb4ff 190deg,rgba(var(--glow,16,163,127),.95) 270deg,rgba(var(--glow,16,163,127),0) 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  animation:ao2-spin 2.8s linear infinite}
@keyframes ao2-spin{to{--ao2-a:360deg}}
@keyframes ao2-breathe{
  0%,100%{box-shadow:0 10px 34px rgba(0,0,0,.35),0 0 18px rgba(var(--glow,16,163,127),.14)}
  50%{box-shadow:0 10px 34px rgba(0,0,0,.35),0 0 34px rgba(var(--glow,16,163,127),.30)}}

/* ---------- 2. blinking caret at the end of streaming text + soft fade-in ---------- */
.row.loading .msg.bot>p:last-child::after,
.row.loading .msg.bot>h4:last-child::after,
.row.loading .msg.bot>ul:last-child>li:last-child::after,
.row.loading .msg.bot>ol:last-child>li:last-child::after,
.row.loading .msg.bot>blockquote:last-child>p:last-child::after{
  content:"";display:inline-block;width:2px;height:1.05em;margin-left:3px;vertical-align:-.16em;border-radius:1px;
  background:var(--accent);animation:ao2-caret 1s steps(1) infinite}
@keyframes ao2-caret{0%,50%{opacity:1}50.01%,100%{opacity:0}}
.ao2-new{animation:ao2-wf .45s ease-out both}
@keyframes ao2-wf{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:blur(0)}}

/* ---------- 3. date separators ---------- */
.ao2-date{width:100%;max-width:760px;margin:6px auto 16px;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;font-weight:600}
.ao2-date::before,.ao2-date::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.ao2-date::after{background:linear-gradient(270deg,transparent,var(--line))}
.ao2-date span{padding:3px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}

/* ---------- 4. content-visibility (long chats only; the newest rows always stay fully rendered) ---------- */
@supports (content-visibility:auto){
  #chat.ao2-cv>.row:not(.loading):not(:nth-last-child(-n+8)){content-visibility:auto;contain-intrinsic-size:auto 170px}
}

/* ---------- 5. code blocks: line numbers, wrap, collapse, copied morph ---------- */
.cb{position:relative}
.msg pre.ao2-ln{display:flex}
.ao2-gut{flex:none;position:sticky;left:0;z-index:1;margin:-12px 14px -12px -12px;padding:12px 10px 12px 12px;
  background:var(--side);border-right:1px solid var(--line);color:var(--muted);opacity:.75;text-align:right;
  font:13.5px/1.55 Consolas,monospace;white-space:pre;user-select:none;-webkit-user-select:none}
.ao2-gut::before{content:attr(data-ln)}
.msg pre.ao2-ln code{flex:1 0 auto;min-width:max-content}
.cb.ao2-wrapped pre code{white-space:pre-wrap!important;overflow-wrap:anywhere;min-width:0!important;flex:1 1 0!important}
.cb.ao2-wrapped .ao2-gut{display:none}
.cb.ao2-col:not(.ao2-open) pre{max-height:360px;overflow-y:hidden;overflow-x:auto}
.cb.ao2-col:not(.ao2-open)::after{content:"";position:absolute;left:0;right:0;bottom:38px;height:56px;pointer-events:none;background:linear-gradient(transparent,var(--side))}
.ao2-more{display:block;width:100%;min-height:38px;border:0;border-top:1px solid var(--line);border-radius:0;background:var(--panel);color:var(--muted);font-size:13px}
.ao2-more:hover{transform:none;box-shadow:none;color:var(--text)}
.ao2-wrap[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.cpb.ao2-ok{color:var(--accent);border-color:var(--accent);animation:ao2-pop .35s cubic-bezier(.2,.8,.2,1)}
.ao2-ck{width:12px;height:12px;margin-right:4px;vertical-align:-1px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;animation:ao2-draw .35s .05s ease-out forwards}
@keyframes ao2-draw{to{stroke-dashoffset:0}}
@keyframes ao2-pop{0%{transform:scale(.9)}60%{transform:scale(1.08)}100%{transform:scale(1)}}

/* ---------- 6. press + ripple ---------- */
button:not(.card)::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  background:radial-gradient(circle at var(--ao2-x,50%) var(--ao2-y,50%),rgba(var(--glow,16,163,127),.38) 0,rgba(var(--glow,16,163,127),.18) calc(var(--ao2-r) * .55),transparent var(--ao2-r))}
button.ao2-rp::before{animation:ao2-rip .55s ease-out}
@keyframes ao2-rip{0%{--ao2-r:0px;opacity:1}100%{--ao2-r:240px;opacity:0}}
button:active:not(:disabled):not(.card){transform:translateY(0) scale(.96)}

/* ---------- 7a. skip links ---------- */
.ao2-skiplinks{position:fixed;top:0;left:0;z-index:100002}
.ao2-skip{position:absolute;left:12px;top:-72px;white-space:nowrap;padding:10px 16px;border-radius:10px;background:var(--text);color:var(--bg);font:600 14px/1 "Segoe UI",system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:top .15s ease}
.ao2-skip:focus{top:12px;outline:2px solid var(--accent);outline-offset:2px}
.ao2-skip+.ao2-skip:focus{left:12px}
#chat:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* ---------- 8. slash commands (looks like the existing suggestion panels) ---------- */
#ao2-slash{position:absolute;left:16px;right:16px;bottom:100%;margin-bottom:6px;max-height:min(50vh,50dvh,300px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 8px 8px;z-index:7;box-shadow:0 14px 40px rgba(0,0,0,.5);overscroll-behavior:contain;animation:ao-up .16s ease-out both}
#ao2-slash h5{margin:10px 8px 4px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
#ao2-slash .sopt kbd{display:none}
#ao2-slash .sopt.ao2-on{background:rgba(16,163,127,.18)}
#ao2-slash .sopt.ao2-on kbd{display:inline-block}
@media(max-width:800px){#ao2-slash{left:10px;right:10px}}

/* ---------- 7b. prefers-contrast ---------- */
@media (prefers-contrast:more){
  :root[data-theme="dark"],:root:not([data-theme]){--line:#8d8d86;--muted:#d6d3cb;--accent:#2fd4a8}
  :root[data-theme="light"]{--line:#4a4a52;--muted:#33333a;--accent:#066a50}
  .msg.you,.card,#box,.mod,.cb,.fcard,.src a,.fup,.mchip,.ao2-date span{border-width:2px}
  .card{color:var(--text)}
  button:focus-visible,#input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid currentColor;outline-offset:3px}
  .msg a{text-decoration:underline;text-decoration-thickness:2px}
  button::after,main::before,#aoDust{display:none}
  .ao2-gut{opacity:1}
  ::selection{background:Highlight;color:HighlightText}
}

/* ---------- 7c. print ---------- */
@media print{
  @page{margin:14mm}
  html,body{height:auto!important;display:block!important;background:#fff!important;color:#000!important}
  #side,.top,#comp,footer,#jump,#scrim,#netbar,#upd,#toast,#tip,#cmenu,#voice,#dropz,#tour,.ov2,
  #aoSplash,#aoDust,#welcome,#alpha-automate-overlay,#alpha-automate-panel,.ao2-skiplinks,#ao2-slash,
  .act,.fups,.cbt,.ao2-more,.resume,.stl{display:none!important}
  main{display:block!important;height:auto!important;overflow:visible!important}
  main::before{display:none!important}
  #chat{overflow:visible!important;height:auto!important;padding:0!important}
  .row{animation:none!important;content-visibility:visible!important;max-width:100%!important;break-inside:avoid-page}
  .msg,.msg.bot{color:#000!important;font-size:12pt}
  .msg.you{background:#f0f0f0!important;border:1px solid #bbb!important;color:#000!important}
  .msg a{color:#000!important;text-decoration:underline}
  .msg a[href^="http"]::after{content:" (" attr(href) ")";font-size:.85em;color:#444}
  .cb{break-inside:avoid;box-shadow:none!important;background:#f7f7f7!important;border-color:#bbb!important}
  .ch{background:#eee!important;color:#333!important}
  .cb pre,.cb pre code{color:#000!important;background:none!important}
  .cb.ao2-col:not(.ao2-open) pre{max-height:none!important;overflow:visible!important}
  .cb.ao2-col::after{display:none!important}
  .msg pre code{white-space:pre-wrap!important;overflow-wrap:anywhere}
  .ao2-gut{position:static!important;background:#eee!important;color:#555!important}
  .tc{color:#555!important}.ts2{color:#1a7f37!important}.tn{color:#b35900!important}.tk{color:#6f42c1!important}
  .ao2-date{color:#444!important}.ao2-date span{background:#fff!important;border-color:#bbb!important}
  .av{display:none!important}
}
</style>
<script id="ao2-script" data-ao-scope="late">
(function(){
  "use strict";
  var byId = function(id){ return document.getElementById(id); };
  var chat = byId("chat"), input = byId("input"), box = byId("box"), comp = byId("comp");
  if (!chat) return;
  var reduce = false; try { reduce = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
  var raf = window.requestAnimationFrame ? function(f){ return requestAnimationFrame(f); } : function(f){ return setTimeout(f, 16); };

  /* ---------- 1. glow ring: on while any reply row is loading ---------- */
  try {
    if (box) {
      var gq = 0, gen = function(){ gq = 0; box.classList.toggle("ao2-gen", !!chat.querySelector(".row.loading")); };
      new MutationObserver(function(){ if (!gq) gq = raf(gen); })
        .observe(chat, {childList: true, subtree: true, attributes: true, attributeFilter: ["class"]});
      gen();
    }
  } catch (e) {}

  /* ---------- 2. soft fade-in for freshly streamed text (the caret is pure CSS) ----------
     The page re-renders the whole reply on every chunk, so we remember when each chunk arrived
     and re-apply the remaining fade to it (negative animation-delay) instead of restarting it. */
  try {
    if (!reduce) {
      var FADE = 450, fstate = new WeakMap();
      var fade = function(m){
        var row = m.closest(".row"); if (!row || !row.classList.contains("loading")) return;
        var s = fstate.get(m); if (!s) { s = {len: 0, ch: []}; fstate.set(m, s); }
        var now = performance.now(), nodes = [], pos = 0, n;
        var w = document.createTreeWalker(m, NodeFilter.SHOW_TEXT, {acceptNode: function(t){
          var p = t.parentNode; return (p && p.closest && p.closest(".cb,.skel")) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; }});
        while ((n = w.nextNode())) { nodes.push({n: n, s: pos}); pos += n.nodeValue.length; }
        if (pos < s.len) { s.len = pos; s.ch = []; }
        if (pos > s.len) { s.ch.push({a: s.len, b: pos, t: now}); s.len = pos; }
        s.ch = s.ch.filter(function(c){ return now - c.t < FADE; });
        if (!s.ch.length) return;
        for (var i = nodes.length - 1; i >= 0; i--) {
          var nd = nodes[i], ns = nd.s, ne = ns + nd.n.nodeValue.length, cur = nd.n;
          for (var j = s.ch.length - 1; j >= 0; j--) {
            var c = s.ch[j], a = Math.max(c.a, ns), b = Math.min(c.b, ne);
            if (a >= b) continue;
            var la = a - ns, lb = b - ns, mid = la > 0 ? cur.splitText(la) : cur;
            if (lb - la < mid.nodeValue.length) mid.splitText(lb - la);
            var sp = document.createElement("span"); sp.className = "ao2-new";
            sp.style.animationDelay = (-(now - c.t)).toFixed(0) + "ms";
            mid.parentNode.insertBefore(sp, mid); sp.appendChild(mid);
          }
        }
      };
      var obsF = new MutationObserver(function(recs){
        var seen = [];
        recs.forEach(function(r){
          var t = r.target;
          if (t && t.nodeType === 1 && t.classList.contains("msg") && t.classList.contains("bot") && seen.indexOf(t) < 0) seen.push(t);
        });
        if (!seen.length) return;
        obsF.disconnect();
        try { seen.forEach(fade); } catch (e) {}
        obsF.observe(chat, {childList: true, subtree: true});
      });
      obsF.observe(chat, {childList: true, subtree: true});
    }
  } catch (e) {}

  /* ---------- 3 + 4. date separators, and content-visibility for long chats ---------- */
  try {
    var dayLabel = function(ts){
      var d = new Date(ts), t0 = new Date(); t0.setHours(0, 0, 0, 0);
      var d0 = new Date(d); d0.setHours(0, 0, 0, 0);
      var diff = Math.round((t0 - d0) / 864e5);
      if (diff === 0) return "Today";
      if (diff === 1) return "Yesterday";
      if (diff > 1 && diff < 7) return d.toLocaleDateString([], {weekday: "long"});
      var o = {month: "short", day: "numeric"}; if (d.getFullYear() !== t0.getFullYear()) o.year = "numeric";
      return d.toLocaleDateString([], o);
    };
    var obsB = new MutationObserver(function(){ sync(); });
    var sync = function(){
      obsB.disconnect();
      try {
        Array.prototype.slice.call(chat.children).forEach(function(el){ if (el.classList.contains("ao2-date")) chat.removeChild(el); });
        var rows = Array.prototype.filter.call(chat.children, function(el){ return el.classList.contains("row"); });
        var H = (typeof history !== "undefined" && Array.isArray(history)) ? history : [];   /* the app's chat array */
        var prev = "";
        rows.forEach(function(r, k){
          var ts = (H[k] && H[k].ts) || Date.now(), key = new Date(ts).toDateString();
          if (key === prev) return;
          prev = key;
          var d = document.createElement("div"); d.className = "ao2-date"; d.setAttribute("aria-hidden", "true");
          var sp = document.createElement("span"); sp.textContent = dayLabel(ts); d.appendChild(sp);
          chat.insertBefore(d, r);
        });
        chat.classList.toggle("ao2-cv", rows.length >= 40);
      } catch (e) {}
      obsB.observe(chat, {childList: true});
    };
    sync();
  } catch (e) {}

  /* ---------- 5. code blocks ---------- */
  try {
    var wrapPref = false; try { wrapPref = localStorage.getItem("ao2_wrap") === "1"; } catch (e) {}
    var COLLAPSE_AT = 22, retryT = 0, eq = 0;
    var WRAP_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h13a3 3 0 0 1 0 6h-4m0 0 2-2m-2 2 2 2M3 18h5"/></svg><span>Wrap</span>';
    var enhance = function(){
      eq = 0;
      var list = chat.querySelectorAll(".cb:not([data-ao2])"), again = false;
      var typing = (typeof typeTimer !== "undefined") && !!typeTimer;   /* the app's typewriter is still filling the text */
      Array.prototype.forEach.call(list, function(cb){
        if (cb.closest(".row.loading")) return;
        if (typing) { again = true; return; }
        var code = cb.querySelector("pre code"), pre = code && code.parentNode;
        if (!code || !pre) { cb.setAttribute("data-ao2", "0"); return; }
        var lines = code.textContent.split("\n"); if (lines.length > 1 && lines[lines.length - 1] === "") lines.pop();
        var n = lines.length; cb.setAttribute("data-ao2", "1");
        if (n >= 2 && n <= 2000) {
          var nums = new Array(n); for (var i = 0; i < n; i++) nums[i] = i + 1;
          var g = document.createElement("span"); g.className = "ao2-gut"; g.setAttribute("aria-hidden", "true"); g.setAttribute("data-ln", nums.join("\n"));
          pre.classList.add("ao2-ln"); pre.insertBefore(g, code);
        }
        var cbt = cb.querySelector(".cbt");
        if (cbt) {
          var wb = document.createElement("button"); wb.type = "button"; wb.className = "cab ao2-wrap";
          wb.setAttribute("data-tip", "Wrap long lines"); wb.setAttribute("aria-pressed", String(wrapPref)); wb.innerHTML = WRAP_SVG;
          cbt.insertBefore(wb, cbt.firstChild);
        }
        if (wrapPref) cb.classList.add("ao2-wrapped");
        if (n > COLLAPSE_AT) {
          var more = document.createElement("button"); more.type = "button"; more.className = "ao2-more";
          more.setAttribute("aria-expanded", "false"); more.textContent = "Show all " + n + " lines";
          more.onclick = function(){
            var open = cb.classList.toggle("ao2-open");
            more.setAttribute("aria-expanded", String(open)); more.textContent = open ? "Collapse" : "Show all " + n + " lines";
          };
          cb.classList.add("ao2-col"); cb.appendChild(more);
        }
      });
      if (again) { clearTimeout(retryT); retryT = setTimeout(schedule, 400); }
    };
    var schedule = function(){ if (!eq) eq = raf(enhance); };
    new MutationObserver(schedule).observe(chat, {childList: true, subtree: true});
    schedule();

    chat.addEventListener("click", function(e){
      var t = e.target; if (!t || !t.closest) return;
      var w = t.closest(".ao2-wrap");
      if (w) {
        var cb = w.closest(".cb"); if (!cb) return;
        var on = cb.classList.toggle("ao2-wrapped"); w.setAttribute("aria-pressed", String(on));
        try { localStorage.setItem("ao2_wrap", on ? "1" : "0"); } catch (x) {}
        wrapPref = on; return;
      }
      /* copied morph: runs after the app's own Copy handler, which has already written the text */
      var b = t.closest(".cpb");
      if (b) {
        b.innerHTML = '<svg class="ao2-ck" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 13 4 4 10-10"/></svg>Copied';
        b.classList.add("ao2-ok"); clearTimeout(b._ao2);
        b._ao2 = setTimeout(function(){ b.classList.remove("ao2-ok"); }, 1450);
      }
    });
  } catch (e) {}

  /* ---------- 6. ripple + haptics ---------- */
  try {
    document.addEventListener("pointerdown", function(e){
      if (reduce) return;
      var b = e.target && e.target.closest && e.target.closest("button");
      if (!b || b.disabled || b.classList.contains("card")) return;
      var r = b.getBoundingClientRect();
      b.style.setProperty("--ao2-x", (e.clientX - r.left) + "px"); b.style.setProperty("--ao2-y", (e.clientY - r.top) + "px");
      b.classList.remove("ao2-rp"); void b.offsetWidth; b.classList.add("ao2-rp");
    }, {passive: true});
    document.addEventListener("animationend", function(e){
      var t = e.target;
      if (e.animationName === "ao2-rip" && t && t.classList) { t.classList.remove("ao2-rp"); t.style.removeProperty("--ao2-x"); t.style.removeProperty("--ao2-y"); }
    }, true);
    if (navigator.vibrate && !reduce) {
      var coarse = matchMedia("(pointer: coarse)");
      var HAP = "#send,#stop,#voiceBtn2,#mic,#newchat,#newTop,#modeBtn,#sugBtn,.sopt,.card,.fup,.mchip";
      document.addEventListener("click", function(e){
        if (!e.isTrusted || !coarse.matches) return;
        var b = e.target && e.target.closest && e.target.closest(HAP);
        if (b) { try { navigator.vibrate(8); } catch (x) {} }
      });
    }
  } catch (e) {}

  /* ---------- 7a. skip links ---------- */
  try {
    var sk = document.createElement("div"); sk.className = "ao2-skiplinks";
    sk.innerHTML = '<a class="ao2-skip" href="#input" data-t="input">Skip to message box</a><a class="ao2-skip" href="#chat" data-t="chat">Skip to conversation</a>';
    sk.addEventListener("click", function(e){
      var a = e.target.closest && e.target.closest("a[data-t]"); if (!a) return;
      e.preventDefault();
      if (a.getAttribute("data-t") === "input") { if (input) input.focus(); }
      else { if (!chat.hasAttribute("tabindex")) chat.setAttribute("tabindex", "-1"); chat.focus(); }
    });
    document.body.insertBefore(sk, document.body.firstChild);
  } catch (e) {}

  /* ---------- 8. slash commands ---------- */
  try {
    if (!input || !comp) return;
    var CMDS = [
      {n: "code",  mode: "code",     icon: "code",    d: "Switch to Code mode: complete, working code"},
      {n: "debug", mode: "debug",    icon: "bug",     d: "Switch to Debug mode: find the cause and fix it"},
      {n: "plan",  mode: "planning", icon: "list",    d: "Switch to Planning mode: requirements and a roadmap"},
      {n: "clear", mode: null,       icon: "refresh", d: "Start a fresh chat. This one stays in your history"}
    ];
    var pop = document.createElement("div"); pop.id = "ao2-slash"; pop.hidden = true;
    pop.setAttribute("role", "listbox"); pop.setAttribute("aria-label", "Slash commands");
    comp.appendChild(pop);
    var items = [], sel = 0;
    var icon = function(n){ try { return (typeof ic === "function") ? ic(n) : ""; } catch (e) { return ""; } };
    var hide = function(){ pop.hidden = true; };
    var setMode = function(key){
      try {
        var i = -1; for (var k = 0; k < MODE_LIST.length; k++) if (MODE_LIST[k][0] === key) { i = k; break; }
        var btn = byId("mpanel").querySelectorAll(".sopt")[i]; if (btn) btn.click();   /* the app's own mode button does the rest */
      } catch (e) {}
    };
    var fire = function(){ input.dispatchEvent(new Event("input")); };
    var run = function(c, rest){
      hide(); input.value = "";
      if (c.n === "clear") { try { newChat(); } catch (e) {} } else setMode(c.mode);
      input.value = rest || ""; fire(); input.focus();
      if (rest) { var s = byId("send"); if (s) s.click(); }
    };
    var paint = function(){
      Array.prototype.forEach.call(pop.querySelectorAll(".sopt"), function(b, i){
        var on = i === sel; b.classList.toggle("ao2-on", on); b.setAttribute("aria-selected", String(on));
        if (on && b.scrollIntoView) b.scrollIntoView({block: "nearest"});
      });
    };
    var render = function(){
      pop.innerHTML = ""; var h = document.createElement("h5"); h.textContent = "Commands"; pop.appendChild(h);
      items.forEach(function(c, i){
        var b = document.createElement("button"); b.type = "button"; b.className = "sopt"; b.tabIndex = -1; b.setAttribute("role", "option");
        b.innerHTML = icon(c.icon) + '<span class="st"><b></b><small></small></span><kbd>\u21B5</kbd>';
        b.querySelector("b").textContent = "/" + c.n; b.querySelector("small").textContent = c.d;
        b.onmousemove = function(){ if (sel !== i) { sel = i; paint(); } };
        b.onclick = function(){ run(c, ""); };
        pop.appendChild(b);
      });
      paint();
    };
    var refresh = function(){
      var m = /^\/([a-z]*)$/i.exec(input.value);
      if (!m) { hide(); return; }
      var q = m[1].toLowerCase();
      var next = CMDS.filter(function(c){ return c.n.indexOf(q) === 0; });
      if (!next.length) { hide(); return; }
      items = next; sel = 0; render(); pop.hidden = false;
    };
    pop.addEventListener("mousedown", function(e){ e.preventDefault(); });   /* keep focus in the message box */
    input.addEventListener("input", refresh);
    input.addEventListener("blur", hide);
    var ARGS = /^\/(code|debug|plan|clear)\s+([\s\S]+)$/i;
    window.addEventListener("keydown", function(e){
      if (e.target !== input || e.isComposing) return;
      if (!pop.hidden) {
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault(); e.stopPropagation();
          sel = (sel + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length; paint();
        } else if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault(); e.stopImmediatePropagation(); run(items[sel], "");
        } else if (e.key === "Tab" && !e.shiftKey) {
          e.preventDefault(); e.stopImmediatePropagation(); input.value = "/" + items[sel].n + " "; fire(); hide();
        } else if (e.key === "Escape") {
          e.preventDefault(); e.stopPropagation(); hide();
        }
        return;
      }
      if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
        var m = ARGS.exec(input.value.trim());
        if (m) {
          var c = CMDS.filter(function(x){ return x.n === m[1].toLowerCase(); })[0];
          if (c) { e.preventDefault(); e.stopImmediatePropagation(); run(c, m[2].trim()); }
        }
      }
    }, true);
  } catch (e) {}
})();
</script>
