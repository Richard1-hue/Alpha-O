<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alpha-O Admin Dashboard</title>
  <style>
    :root {
      --bg: #121212;
      --panel: #1b1b1b;
      --panel-2: #212121;
      --line: #2f2f2f;
      --text: #f2f2f2;
      --muted: #a7a7a7;
      --accent: #10a37f;
      --success: #2ec27e;
      --warning: #f7c948;
      --danger: #ff6b6b;
      --shadow: rgba(0,0,0,0.28);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; }
    body { padding: 28px; }

    .wrap { max-width: 1300px; margin: 0 auto; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; margin-bottom: 22px;
    }
    .title { font-size: clamp(1.8rem, 3vw, 2.6rem); margin: 0; }
    .subtitle { color: var(--muted); margin-top: 6px; }
    .button {
      appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--text);
      border-radius: 12px; padding: 10px 16px; font: inherit; cursor: pointer;
    }
    .button:hover { border-color: #5d5d5d; }

    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px; margin-bottom: 18px;
    }
    .stat {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line); border-radius: 18px; padding: 18px 18px 16px;
      box-shadow: 0 10px 26px var(--shadow);
    }
    .stat small {
      display: block; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-size: 11px; margin-bottom: 8px;
    }
    .stat strong {
      display: block; font-size: clamp(1.7rem, 2vw, 2.4rem); font-weight: 700;
    }
    .stat .trend {
      margin-top: 8px; font-size: 12px; color: var(--muted);
    }

    .grid {
      display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; margin-top: 18px;
    }
    .panel {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: 0 10px 26px var(--shadow);
    }
    .panel h3 {
      margin: 0 0 14px; font-size: 1.1rem;
    }

    .hour-grid {
      display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; align-items: end; height: 180px; margin-top: 10px;
    }
    .hour-col {
      background: linear-gradient(180deg, rgba(16,163,127,0.95), rgba(16,163,127,0.3));
      border-radius: 10px 10px 0 0;
      min-height: 6px; position: relative;
      transition: transform .2s ease;
    }
    .hour-col span {
      position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
      font-size: 10px; color: var(--muted);
    }
    .hour-col:hover { transform: translateY(-2px); }

    table {
      width: 100%; border-collapse: collapse; font-size: 14px;
    }
    th, td {
      padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top;
    }
    th { color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
    .tag {
      display: inline-block; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 11px;
    }
    .tag.success { background: rgba(46,194,126,0.15); color: #b7f2d3; }
    .tag.fail { background: rgba(255,107,107,0.12); color: #ffb3b3; }

    ul.list {
      list-style: none; padding: 0; margin: 0; display: grid; gap: 10px;
    }
    ul.list li {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,0.02);
    }
    .muted { color: var(--muted); }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      body { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1 class="title">Alpha-O Admin Dashboard</h1>
        <div class="subtitle">Traffic, requests, activity, and response metrics</div>
      </div>
      <button class="button" id="resetBtn">Reset demo data</button>
    </div>

    <section class="stats">
      <div class="stat">
        <small>Total visits</small>
        <strong id="totalVisits">0</strong>
        <div class="trend" id="visitTrend">—</div>
      </div>
      <div class="stat">
        <small>Unique visitors</small>
        <strong id="uniqueVisitors">0</strong>
        <div class="trend" id="visitorTrend">—</div>
      </div>
      <div class="stat">
        <small>Requests</small>
        <strong id="totalRequests">0</strong>
        <div class="trend" id="requestTrend">—</div>
      </div>
      <div class="stat">
        <small>Success rate</small>
        <strong id="successRate">0%</strong>
        <div class="trend" id="successTrend">—</div>
      </div>
      <div class="stat">
        <small>Avg response</small>
        <strong id="avgResponse">0s</strong>
        <div class="trend" id="responseTrend">—</div>
      </div>
    </section>

    <section class="grid">
      <div class="panel">
        <h3>Hourly activity</h3>
        <div class="hour-grid" id="hourGrid"></div>
      </div>

      <div class="panel">
        <h3>Traffic summary</h3>
        <ul class="list" id="trafficSummary"></ul>
      </div>
    </section>

    <section class="grid">
      <div class="panel">
        <h3>Recent requests</h3>
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Prompt</th>
              <th>Status</th>
              <th>Duration</th>
            </tr>
          </thead>
          <tbody id="requestTable"></tbody>
        </table>
      </div>

      <div class="panel">
        <h3>Top prompts</h3>
        <ul class="list" id="topPrompts"></ul>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "alphaO_analytics";
    const MAX_ITEMS = 2500;

    function loadAnalytics() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return { visits: [], requests: [] };
        }
        const parsed = JSON.parse(raw);
        return { visits: Array.isArray(parsed.visits) ? parsed.visits : [], requests: Array.isArray(parsed.requests) ? parsed.requests : [] };
      } catch (error) {
        return { visits: [], requests: [] };
      }
    }

    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
    }

    function shortPrompt(prompt) {
      const text = (prompt || "").trim();
      if (!text) return "No prompt";
      return text.length > 60 ? text.slice(0, 60) + "..." : text;
    }

    function uniqueVisitors(visits) {
      const set = new Set();
      visits.forEach(v => set.add(v.visitorId || "unknown"));
      return set.size;
    }

    function calcHourlyData(items) {
      const counts = new Array(24).fill(0);
      items.forEach(item => {
        const hour = new Date(item.ts).getHours();
        counts[hour] += 1;
      });
      return counts;
    }

    function renderStats() {
      const analytics = loadAnalytics();
      const visits = analytics.visits;
      const requests = analytics.requests;

      const totalVisits = visits.length;
      const totalRequests = requests.length;
      const successCount = requests.filter(r => r.ok).length;
      const avgResponse = requests.length ? (requests.reduce((sum, item) => sum + (Number(item.duration) || 0), 0) / requests.length) / 1000 : 0;

      const unique = uniqueVisitors(visits);
      const successRate = totalRequests ? (successCount / totalRequests) * 100 : 0;

      document.getElementById("totalVisits").textContent = totalVisits;
      document.getElementById("uniqueVisitors").textContent = unique;
      document.getElementById("totalRequests").textContent = totalRequests;
      document.getElementById("successRate").textContent = Math.round(successRate) + "%";
      document.getElementById("avgResponse").textContent = avgResponse.toFixed(1) + "s";

      document.getElementById("visitTrend").textContent = totalVisits ? "Tracked from current session data" : "No visits yet";
      document.getElementById("visitorTrend").textContent = unique ? "Distinct visitors recorded" : "No visitor IDs yet";
      document.getElementById("requestTrend").textContent = totalRequests ? "Requests captured successfully" : "No requests yet";
      document.getElementById("successTrend").textContent = totalRequests ? successCount + " successful" : "No successful requests";
      document.getElementById("responseTrend").textContent = totalRequests ? "Average request time" : "Waiting for activity";

      const hourCounts = calcHourlyData([...visits, ...requests]);
      const hourGrid = document.getElementById("hourGrid");
      hourGrid.innerHTML = "";

      const maxVal = Math.max(...hourCounts, 1);
      hourCounts.forEach((count, index) => {
        const column = document.createElement("div");
        column.className = "hour-col";
        column.style.height = Math.max(10, (count / maxVal) * 100) + "%";
        column.title = `${index}:00 — ${count} events`;
        const label = document.createElement("span");
        label.textContent = index;
        column.appendChild(label);
        hourGrid.appendChild(column);
      });

      const trafficSummary = document.getElementById("trafficSummary");
      trafficSummary.innerHTML = "";
      const summaryItems = [
        { label: "Page views", value: totalVisits },
        { label: "AI requests", value: totalRequests },
        { label: "Successful replies", value: successCount },
        { label: "Failed requests", value: totalRequests - successCount },
        { label: "Busiest hour", value: getBusiestHour([...visits, ...requests]) }
      ];

      summaryItems.forEach(item => {
        const li = document.createElement("li");
        li.innerHTML = `<span>${item.label}</span><strong>${item.value}</strong>`;
        trafficSummary.appendChild(li);
      });

      const requestTable = document.getElementById("requestTable");
      requestTable.innerHTML = "";
      const recent = [...requests].reverse().slice(0, 8);
      if (!recent.length) {
        requestTable.innerHTML = `<tr><td colspan="4" class="muted">No request activity yet.</td></tr>`;
      } else {
        recent.forEach(item => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${formatTime(item.ts)}</td>
            <td>${shortPrompt(item.prompt)}</td>
            <td><span class="tag ${item.ok ? "success" : "fail"}">${item.ok ? "Success" : "Failed"}</span></td>
            <td>${((Number(item.duration) || 0) / 1000).toFixed(1)}s</td>
          `;
          requestTable.appendChild(tr);
        });
      }

      const topPrompts = document.getElementById("topPrompts");
      topPrompts.innerHTML = "";
      const counts = {};
      requests.forEach(item => {
        const text = (item.prompt || "").trim();
        if (!text) return;
        counts[text] = (counts[text] || 0) + 1;
      });

      const sortedPromptEntries = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 6);
      if (!sortedPromptEntries.length) {
        topPrompts.innerHTML = '<li><span class="muted">No prompts recorded yet</span></li>';
      } else {
        sortedPromptEntries.forEach(([prompt, count]) => {
          const li = document.createElement("li");
          li.innerHTML = `<span>${shortPrompt(prompt)}</span><strong>${count}</strong>`;
          topPrompts.appendChild(li);
        });
      }
    }

    function getBusiestHour(items) {
      const counts = new Array(24).fill(0);
      items.forEach(item => {
        const hour = new Date(item.ts).getHours();
        counts[hour] += 1;
      });
      const maxHour = counts.indexOf(Math.max(...counts));
      return `${maxHour}:00`;
    }

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (confirm("Clear all stored analytics data?")) {
        localStorage.removeItem(STORAGE_KEY);
        renderStats();
      }
    });

    renderStats();
  </script>
</body>
</html>
